<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Bistro Dashboard - Farm Fresh Restaurant Website</title>
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <meta content="" name="keywords">
    <meta content="" name="description">

    <link href="img/favicon.ico" rel="icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;500&family=Lora:wght@600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.10.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.4.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="lib/animate/animate.min.css" rel="stylesheet">
    <link href="lib/owlcarousel/assets/owl.carousel.min.css" rel="stylesheet">
    <link href="css/bootstrap.min.css" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>

<body id="bistroDashboardPage">
    <div class="bistro-dashboard-layout">
        <aside class="bistro-dashboard-sidebar">
            <a href="index.html" class="bistro-dashboard-brand">B<span>is</span>tro</a>
            <p class="mb-4">Restaurant Operations</p>
            <nav class="bistro-dashboard-nav">
                <a href="#bistroDashboardContent"><i class="fa fa-chart-line me-2"></i>Overview</a>
                <a href="product.html"><i class="fa fa-utensils me-2"></i>Public Menu</a>
                <a href="contact.html"><i class="fa fa-calendar-check me-2"></i>Reservations</a>
                <a href="index.html"><i class="fa fa-home me-2"></i>Website</a>
            </nav>
        </aside>

        <main class="bistro-dashboard-main">
            <header class="bistro-dashboard-header">
                <div>
                    <span class="bistro-role-pill" id="bistroDashboardRole">Role</span>
                    <h1 id="bistroDashboardTitle">Dashboard</h1>
                    <p id="bistroDashboardSubtitle">Loading dashboard...</p>
                </div>
                <div class="bistro-dashboard-actions">
                    <span class="text-muted">User: <strong id="bistroDashboardUser">-</strong></span>
                    <button class="btn btn-outline-primary rounded-pill" id="bistroLogout" type="button">Logout</button>
                </div>
            </header>

            <section class="row g-4 mb-4" id="bistroDashboardStats"></section>
            <section id="bistroDashboardContent"></section>
        </main>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="lib/wow/wow.min.js"></script>
    <script src="lib/easing/easing.min.js"></script>
    <script src="lib/waypoints/waypoints.min.js"></script>
    <script src="lib/owlcarousel/owl.carousel.min.js"></script>
    <script src="js/main.js"></script>
</body>

</html>
